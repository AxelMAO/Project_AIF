<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédiction de Genre de Film</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">
        <h1>Prédiction de Genre de Film</h1>

        <form id="uploadForm">
            <input type="file" id="imageInput" name="file" accept="image/*" required>
            <button type="submit">Prédire le genre</button>
            <button type="button" id="recommendButton">Recommander par affiche</button>
        </form>

        <div id="previewContainer" style="margin-top: 20px;">
            <h2>Aperçu de l'image</h2>
            <img id="imagePreview" src="#" alt="Prévisualisation" style="display:none; max-width: 300px;">
        </div>

        <p id="predictionText" style="font-weight: bold;"></p>

        <div class="recommendation-block">
            <h2>Recommandation par affiche</h2>
            <div id="recommendationImages"></div>
        </div>

        <div class="recommendation-block">
            <h2>Recommandation par résumé</h2>
            <textarea id="plotInput" rows="4" cols="50" placeholder="Entrez un résumé de film..."></textarea><br>
            <button type="button" id="recommendPlotButton">Recommander par résumé</button>
            <div id="plotRecommendations" class="plot-recommendations"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
