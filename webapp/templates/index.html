<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HomePage - MovieAI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>

<body>
    <!-- Particules d'étoiles -->
    <div id="particles-js"></div>

    <!-- Contenu principal -->
    <div class="home-container">
        <div class="authors-box">
            <p>Realised by:</p>
            <p> Axel OLOUGOUNA, Ayoub CHOUKRI</p>
            <p> Duy NGUYEN, Qian WANG</p>
            <p> and supervised by: David BERTOIN</p>
        </div>

        <h1> Welcome to MovieAI</h1>
        <p>Choose a service :</p>

        <div class="home-buttons">
            <button onclick="navigateTo('predict_page')">Predict film genre</button>
            <button onclick="navigateTo('recommend_poster_page')">Recommendation based on the film poster</button>
            <button onclick="navigateTo('recommend_plot_page')">Recommendation based on the film's plot</button>
        </div>
    </div>

    <!-- Navigation JS -->
    <script>
        function navigateTo(service) {
            window.location.href = `/${service}`;
        }
    
        // Configuration de particles.js avec interactivité
        particlesJS({
  "particles": {
    "number": {
      "value": 80,
      "density": {
        "enable": true,
        "value_area": 800
      }
    },
    "color": {
      "value": "#ffffff"
    },
    "shape": {
      "type": "circle",
      "stroke": {
        "width": 0,
        "color": "#000000"
      },
      "polygon": {
        "nb_sides": 5
      },
      "image": {
        "src": "img/github.svg",
        "width": 100,
        "height": 100
      }
    },
    "opacity": {
      "value": 0.5,
      "random": false,
      "anim": {
        "enable": false,
        "speed": 1,
        "opacity_min": 0.1,
        "sync": false
      }
    },
    "size": {
      "value": 3,
      "random": true,
      "anim": {
        "enable": false,
        "speed": 40,
        "size_min": 0.1,
        "sync": false
      }
    },
    "line_linked": {
      "enable": true,
      "distance": 150,
      "color": "#ffffff",
      "opacity": 0.4,
      "width": 1
    },
    "move": {
      "enable": true,
      "speed": 6,
      "direction": "none",
      "random": false,
      "straight": false,
      "out_mode": "out",
      "bounce": false,
      "attract": {
        "enable": false,
        "rotateX": 600,
        "rotateY": 1200
      }
    }
  },
  "interactivity": {
    "detect_on": "window",
    "events": {
      "onhover": {
        "enable": true,
        "mode": "bubble"
      },
      "onclick": {
        "enable": true,
        "mode": "push"
      },
      "resize": true
    },
    "modes": {
      "grab": {
        "distance": 400,
        "line_linked": {
          "opacity": 1
        }
      },
      "bubble": {
        "distance": 400,
        "size": 25,
        "duration": 2,
        "opacity": 8,
        "speed": 3
      },
      "repulse": {
        "distance": 200,
        "duration": 0.4
      },
      "push": {
        "particles_nb": 4
      },
      "remove": {
        "particles_nb": 2
      }
    }
  },
  "retina_detect": true
        });
    </script>
    
</body>
</html>
